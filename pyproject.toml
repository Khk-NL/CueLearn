[project]
name = "cuelearn-learning-api"
version = "0.3.0"
description = "CueLearn 视频语境学习系统 · 学习数据采集后端（SQLite 模拟 PocketBase）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
